services:
  # Development server with live reload
  dev:
    image: hugomods/hugo:exts-0.147.0
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -d /src/themes/hugo-book ]; then
          echo "Downloading hugo-book theme..."
          mkdir -p /src/themes
          git clone --depth 1 --branch v13 https://github.com/alex-shpak/hugo-book.git /src/themes/hugo-book
        fi
        hugo server --bind 0.0.0.0 --buildDrafts --buildFuture
    working_dir: /src
    volumes:
      - .:/src
    ports:
      - "1317:1313"
    profiles:
      - dev

  # Build static site only
  build:
    image: hugomods/hugo:exts-0.147.0
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ ! -d /src/themes/hugo-book ]; then
          echo "Downloading hugo-book theme..."
          mkdir -p /src/themes
          git clone --depth 1 --branch v13 https://github.com/alex-shpak/hugo-book.git /src/themes/hugo-book
        fi
        hugo --minify
    working_dir: /src
    volumes:
      - .:/src
    profiles:
      - build

  # Production server
  docs:
    image: markneurone-doc:latest
    container_name: markneurone-docs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.services.markneurone-docs.loadbalancer.server.port=80"
      # Router HTTPS (pour accès direct ou Cloudflare Full)
      - "traefik.http.routers.markneurone-docs.rule=Host(`mark.zeroneurone.com`)"
      - "traefik.http.routers.markneurone-docs.entrypoints=websecure"
      - "traefik.http.routers.markneurone-docs.tls.certresolver=letsencrypt"
      - "traefik.http.routers.markneurone-docs.service=markneurone-docs"
      - "traefik.http.routers.markneurone-docs.middlewares=cloudflare-ips@file"
      # Router HTTP (pour Cloudflare Flexible)
      - "traefik.http.routers.markneurone-docs-http.rule=Host(`mark.zeroneurone.com`)"
      - "traefik.http.routers.markneurone-docs-http.entrypoints=web"
      - "traefik.http.routers.markneurone-docs-http.service=markneurone-docs"
      - "traefik.http.routers.markneurone-docs-http.middlewares=cloudflare-ips@file"

networks:
  web:
    external: true
